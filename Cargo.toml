[workspace]
resolver = "2"
members = [
    "crates/robbo-core",
    "crates/robbo-formats",
    "crates/robbo-app",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["digit1024"]
version = "0.1.0"

[workspace.dependencies]
bevy = { version = "0.15", default-features = true }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
thiserror = "2"
