name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libvulkan1 mesa-vulkan-drivers libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0
      - name: cargo check
        run: unset ARGV0 && cargo check --workspace
      - name: cargo test
        run: xvfb-run -a -s "-screen 0 1280x720x24" bash -c 'unset ARGV0 && cargo test --workspace -- --test-threads=1'

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: wasm build
        run: unset ARGV0 && RUSTFLAGS="" cargo build -p robbo-app --target wasm32-unknown-unknown --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: android compile check
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android31-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android31-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android31-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          unset ARGV0
          cargo check -p robbo-app --target aarch64-linux-android

  game-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libvulkan1 mesa-vulkan-drivers libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0
      - name: Game smoke test (boot, level, move, screenshot)
        run: chmod +x scripts/run_game_smoke_test.sh && scripts/run_game_smoke_test.sh
